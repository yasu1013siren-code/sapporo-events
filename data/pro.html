<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>飲食店PRO β</title><link rel="stylesheet" href="pro.css"><main><a href="index.html">無料イベント一覧へ</a><h1>営業前の情報チェックを、ひとつに。</h1><p>飲食店PRO β · 月額980円のβ案。試用段階・決済と課金は未開始。</p><p>来客数や売上への影響は予測しません。開催時刻・終了時刻は根拠ページで確認してください。</p><form id="settings"><label>店舗名<input id="store" maxlength="80" placeholder="店舗名（この端末に保存）"></label><label>重点地区<select id="area"><option value="all">すべて</option><option>中央区</option><option>すすきの</option></select></label><label>期間<select id="period"><option value="week">今週（月〜日・終了分を除外）</option><option value="future">7〜30日先（両端含む）</option><option value="unknown">日時不明・要確認</option></select></label><label>種類<select id="kind"><option value="all">すべて</option><option>イベント</option><option>開店閉店</option></select></label><button>設定を保存</button></form><p id="status" role="status"></p><button id="reload">再取得</button> <button id="digest">通知文を出力</button><p>通知はプレビューとテキスト出力のみ。LINE・メールへ送信しません。</p><textarea id="preview" readonly aria-label="通知プレビュー"></textarea><section id="list" aria-label="イベント情報"></section></main><script type="module" src="pro.js"></script></html>
