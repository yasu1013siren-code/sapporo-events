name: PRO beta tests
on:
  pull_request:
    paths:
      - 'pro_beta.py'
      - 'pro/**'
      - 'tests/**'
      - 'sapporo_chuo_collector.py'
      - '.github/workflows/pro-beta-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile pro_beta.py sapporo_chuo_collector.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test pro/intake-review/tests/intake.test.mjs
